# Mantém o projeto Supabase cloud ativo (plano Free pausa após ~7 dias sem queries).
# Requer GitHub Actions habilitado no repositório.
name: Keep Supabase cloud active

on:
  schedule:
    # Diário às 09:00 UTC (~06:00 Brasília)
    - cron: '0 9 * * *'
  workflow_dispatch:

env:
  SUPABASE_URL: https://xiplrnkeghrsmkfmrnhh.supabase.co
  SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpcGxybmtlZ2hyc21rZm1ybmhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNzU2NTAsImV4cCI6MjEwMzg1MTY1MH0.ENHKcDs2ZOA5ccbFXz4HMVjZ8UA2Ue2G0HxCjlXktVk

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query conteudos (atividade no banco)
        run: |
          set -euo pipefail
          url="${SUPABASE_URL}/rest/v1/conteudos?select=id&limit=1"
          code=$(curl -sS -o /tmp/supabase-ping.json -w "%{http_code}" \
            "$url" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP ${code}"
          cat /tmp/supabase-ping.json || true
          if [ "$code" != "200" ]; then
            echo "::warning::Supabase cloud respondeu ${code}. Projeto pode estar pausado — retome no dashboard."
            exit 1
          fi
