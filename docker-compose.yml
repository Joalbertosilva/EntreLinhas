# Docker Compose — tcc-sistema (desenvolvimento)
#
# Backend Supabase: gerenciado pelo Supabase CLI (supabase start).
# O CLI cria containers Docker para PostgreSQL, Auth, Storage, Studio, etc.
# Não duplicar serviços Supabase neste arquivo.
#
# Uso:
#   supabase start                              # backend (obrigatório)
#   docker compose --profile tools up -d        # ferramentas auxiliares (opcional)
#   docker compose --profile tools down         # parar ferramentas
#
# Documentação: docs/docker.md

name: tcc-sistema

services:
  # Interface web para inspecionar o PostgreSQL do Supabase local
  adminer:
    image: adminer:4
    container_name: tcc-sistema-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - tools

  # Placeholder para serviços futuros (ex.: redis, mailhog)
  # Adicionar somente quando houver necessidade concreta (docs/mvp-scope.md)

networks:
  default:
    name: tcc-sistema-dev
